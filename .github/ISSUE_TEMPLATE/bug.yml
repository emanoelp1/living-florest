name: Bug
description: Reportar um defeito reproduzível no protótipo
title: "fix: "
labels: [bug]
body:
  - type: input
    id: requirement
    attributes:
      label: Requisito afetado
      description: Informe RF-XX ou RNF-XX do GDD.
      placeholder: RF-XX / RNF-XX
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: Passos, cena, versão do Godot e resultado observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch proposta
      placeholder: bugfix/<issue_id>-<nome>
